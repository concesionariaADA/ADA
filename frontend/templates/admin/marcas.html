<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marcas - ADA Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/css/estilos.css">
</head>
<body class="admin-ada">
  <!-- Top bar and sidebar are rendered here by /js/menu-admin.js -->
  <div id="menu-admin"></div>

  <main class="contenido-admin">
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="/admin">Admin</a></li>
        <li class="breadcrumb-item">PARÁMETROS</li>
        <li class="breadcrumb-item active" aria-current="page">Marcas</li>
      </ol>
    </nav>
    <h1 class="h4 titulo-seccion mb-4">Marcas</h1>

    <div id="marcas-error" class="alert alert-danger d-none" role="alert"></div>

    <div class="card">
      <div class="card-body p-4">
        <form id="marcas-filtros" class="row g-2 align-items-end mb-3" role="search">
          <div class="col-12 col-md-6">
            <label class="form-label" for="marcas-buscar">Buscar marca</label>
            <input id="marcas-buscar" class="form-control" type="search" placeholder="Nombre de la marca" autocomplete="off">
          </div>
          <div class="col-12 col-md-3">
            <label class="form-label" for="marcas-tipo">Tipo de vehículo</label>
            <select id="marcas-tipo" class="form-select">
              <option value="">Todos</option>
              <option value="AUTOMOVIL">Automóvil</option>
              <option value="CAMIONETA">Camioneta</option>
              <option value="MOTOCICLETA">Motocicleta</option>
            </select>
          </div>
          <div class="col-12 col-md-3">
            <p id="marcas-total" class="mb-2 text-md-end text-muted" aria-live="polite">Cargando…</p>
          </div>
        </form>

        <div class="table-responsive">
          <table class="table table-sm table-hover align-middle mb-0">
            <thead>
              <tr>
                <th scope="col">Marca</th>
                <th scope="col">MakeId vPIC</th>
                <th scope="col">Tipos de vehículo</th>
                <th scope="col">Estado</th>
              </tr>
            </thead>
            <tbody id="marcas-filas"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/menu-admin.js"></script>
  <script src="/js/marcas-admin.js"></script>
</body>
</html>
