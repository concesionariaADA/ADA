<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar - Administración ADA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
  <nav class="navbar navbar-dark navbar-ada">
    <div class="container">
      <a class="navbar-brand" href="/">ADA <span>Concesionaria</span></a>
    </div>
  </nav>

  <main class="login-ada d-flex align-items-center justify-content-center p-3">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 titulo-seccion text-center mb-4">Administración</h1>
        <div id="login-error" class="alert alert-danger d-none" role="alert"></div>
        <form id="form-login" novalidate>
          <div class="mb-3">
            <label for="usuario" class="form-label">Usuario</label>
            <input type="text" class="form-control" id="usuario" name="usuario" autocomplete="username" required>
          </div>
          <div class="mb-4">
            <label for="contrasena" class="form-label">Contraseña</label>
            <input type="password" class="form-control" id="contrasena" name="contrasena" autocomplete="current-password" required>
          </div>
          <button type="submit" id="boton-ingresar" class="btn btn-primary w-100">Ingresar</button>
        </form>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
