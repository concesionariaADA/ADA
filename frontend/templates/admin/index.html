<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard - ADA Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/css/estilos.css">
</head>
<body class="admin-ada">
  <!-- Top bar and sidebar are rendered here by /js/menu-admin.js -->
  <div id="menu-admin"></div>

  <main class="contenido-admin">
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="/admin">Admin</a></li>
        <li class="breadcrumb-item active" aria-current="page">Dashboard</li>
      </ol>
    </nav>
    <h1 class="h4 titulo-seccion mb-4">Dashboard</h1>

    <div id="dashboard-error" class="alert alert-danger d-none" role="alert"></div>

    <div class="row g-3">
      <div class="col-12 col-sm-6 col-xl-4">
        <div class="card tarjeta-dashboard h-100">
          <div class="card-body">
            <p class="tarjeta-dashboard-titulo">Unidades disponibles</p>
            <p class="tarjeta-dashboard-valor" data-dato="unidadesDisponibles">…</p>
          </div>
        </div>
      </div>
      <div class="col-12 col-sm-6 col-xl-4">
        <div class="card tarjeta-dashboard h-100">
          <div class="card-body">
            <p class="tarjeta-dashboard-titulo">Unidades reservadas</p>
            <p class="tarjeta-dashboard-valor" data-dato="unidadesReservadas">…</p>
          </div>
        </div>
      </div>
      <div class="col-12 col-sm-6 col-xl-4">
        <div class="card tarjeta-dashboard h-100">
          <div class="card-body">
            <p class="tarjeta-dashboard-titulo">Unidades vendidas</p>
            <p class="tarjeta-dashboard-valor" data-dato="unidadesVendidas">…</p>
          </div>
        </div>
      </div>
      <div class="col-12 col-sm-6 col-xl-4">
        <div class="card tarjeta-dashboard h-100">
          <div class="card-body">
            <p class="tarjeta-dashboard-titulo">Ventas confirmadas</p>
            <p class="tarjeta-dashboard-valor" data-dato="ventasConfirmadas">…</p>
            <a class="stretched-link tarjeta-dashboard-enlace" href="/admin/ventas">Ver ventas</a>
          </div>
        </div>
      </div>
      <div class="col-12 col-sm-6 col-xl-4">
        <div class="card tarjeta-dashboard h-100">
          <div class="card-body">
            <p class="tarjeta-dashboard-titulo">Clientes</p>
            <p class="tarjeta-dashboard-valor" data-dato="clientes">…</p>
            <a class="stretched-link tarjeta-dashboard-enlace" href="/admin/clientes">Ver clientes</a>
          </div>
        </div>
      </div>
      <div class="col-12 col-sm-6 col-xl-4">
        <div class="card tarjeta-dashboard h-100">
          <div class="card-body">
            <p class="tarjeta-dashboard-titulo">Empleados</p>
            <p class="tarjeta-dashboard-valor" data-dato="empleados">…</p>
            <a class="stretched-link tarjeta-dashboard-enlace" href="/admin/vendedores">Ver vendedores</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/menu-admin.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
